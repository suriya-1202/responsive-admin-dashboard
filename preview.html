        if (subtitle) lines.push({ text: subtitle, size: 9, dy: 16, font: '/F1' });
        lines.push({ text: '----------------------------------------------------------------------------------------------------', size: 8, dy: 16, font: '/F1' });

          streamBody += `BT ${line.font || '/F1'} ${line.size || 9} Tf 45 ${currentY} Td (${cleanText}) Tj ET\n`;
          currentY -= (line.dy || 14);
        }
        const o1 = '1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n';
        const o2 = '2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n';
        const o3 = '3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Contents 4 0 R /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>\nendobj\n';
        const o4 = `4 0 obj\n<< /Length ${streamBody.length} >>\nstream\n${streamBody}endstream\nendobj\n`;
        const o5 = '5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>\nendobj\n';
        const o6 = '6 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>\nendobj\n';
        const header = '%PDF-1.4\n';

        const p4 = p3 + o3.length; const p5 = p4 + o4.length; const p6 = p5 + o5.length;
        const xrefStart = p6 + o6.length;
        const pad = n => ('0000000000' + n).slice(-10);
        const xref = 'xref\n0 7\n0000000000 65535 f \n' + pad(p1) + ' 00000 n \n' + pad(p2) + ' 00000 n \n' + pad(p3) + ' 00000 n \n' + pad(p4) + ' 00000 n \n' + pad(p5) + ' 00000 n \n' + pad(p6) + ' 00000 n \n';
        const trailer = `trailer\n<< /Size 7 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF\n`;
        return header + o1 + o2 + o3 + o4 + o5 + o6 + xref + trailer;

                              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.825rem', color: 'var(--text-main)', fontWeight: 600 }}><Check size={16} style={{ color: 'var(--primary)' }} /> Dedicated TAM & 15-Min SLA</div>
                            </div>

                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.75rem' }}>
                              <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>Auto-renew active via Corporate Mastercard ending in <strong>{paymentCard.last4}</strong></div>
                              <div style={{ display: 'flex', gap: '0.65rem' }}>
                                <button type="button" className="primary-btn" onClick={() => setShowUpgradeModal(true)}><Zap size={14} /> Upgrade / Change Tier</button>
                                <button type="button" className="secondary-btn" onClick={() => setShowPaymentModal(true)}>Update Card</button>
                              </div>
                            </div>
                          </div>

                          {/* Live Metered Quotas */}
                          <div>
                            <h4 style={{ fontSize: '0.95rem', fontWeight: 700, color: 'var(--text-main)', marginBottom: '0.85rem' }}>Live Resource Quotas & Infrastructure Telemetry</h4>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(240px, 1fr))', gap: '1rem' }}>
                              {[
                                { title: 'API Request Volume', pct: '78.4%', used: '7,842,100 used', cap: '10,000,000 cap', color: 'var(--primary)' },
                                { title: 'Global Edge CDN Bandwidth', pct: '71.0%', used: '1.42 TB routed', cap: '2.0 TB limit', color: 'var(--primary)' },
                                { title: 'Admin & Operator Licenses', pct: '72.0%', used: '18 / 25 assigned', cap: '7 licenses open', color: 'var(--success)' },
                                { title: 'Encrypted Storage & Backups', pct: '41.2%', used: '412 GB stored', cap: '1,000 GB cap', color: 'var(--dark-navy)' }
                              ].map((q, idx) => (
                                <div key={idx} style={{ padding: '1.15rem', borderRadius: '10px', border: '1px solid var(--border)', backgroundColor: '#ffffff' }}>
                                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.5rem' }}>
                                    <span style={{ fontSize: '0.825rem', fontWeight: 700, color: 'var(--text-main)' }}>{q.title}</span>
                                    <span style={{ fontSize: '0.825rem', fontWeight: 800, color: q.color }}>{q.pct}</span>
                                  </div>
                                  <div style={{ height: '7px', backgroundColor: '#e2e8f0', borderRadius: '4px', overflow: 'hidden', marginBottom: '0.65rem' }}>
                                    <div style={{ width: q.pct, height: '100%', backgroundColor: q.color, borderRadius: '4px' }}></div>
                                  </div>
                                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem', color: 'var(--text-muted)' }}>
                                    <span>{q.used}</span>
                                    <span>{q.cap}</span>
                                  </div>
                                </div>
                              ))}
                            </div>
                          </div>

                          {/* Payment Methods & Profile */}
                          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.25rem' }}>
                            <div style={{ padding: '1.25rem', borderRadius: '10px', border: '1px solid var(--border)', backgroundColor: '#ffffff' }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                                <h4 style={{ fontSize: '0.9rem', fontWeight: 700, color: 'var(--text-main)' }}>Payment Methods</h4>
                                <button type="button" className="secondary-btn" style={{ fontSize: '0.75rem', padding: '0.35rem 0.65rem' }} onClick={() => setShowPaymentModal(true)}>+ Add Method</button>
                              </div>
                              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.85rem 1rem', borderRadius: '8px', backgroundColor: '#f8fafc', border: '1px solid var(--border)', marginBottom: '0.65rem' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                  <div style={{ width: '40px', height: '28px', borderRadius: '4px', backgroundColor: 'var(--dark-navy)', color: '#ffffff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                    <CreditCard size={18} />
                                  </div>
                                  <div>
                                    <div style={{ fontSize: '0.85rem', fontWeight: 700, color: 'var(--text-main)' }}>{paymentCard.brand} •••• {paymentCard.last4}</div>
                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>Expires {paymentCard.expiry} • {paymentCard.holder}</div>
                                  </div>
                                </div>
                                <span style={{ fontSize: '0.7rem', fontWeight: 700, padding: '0.15rem 0.5rem', borderRadius: '4px', backgroundColor: 'var(--primary-light)', color: 'var(--primary)' }}>Default</span>
                              </div>
                              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.85rem 1rem', borderRadius: '8px', backgroundColor: '#ffffff', border: '1px solid var(--border)' }}>
                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                                  <div style={{ width: '40px', height: '28px', borderRadius: '4px', backgroundColor: '#f1f5f9', color: 'var(--text-muted)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                                    <Zap size={18} />
                                  </div>
                                  <div>
                                    <div style={{ fontSize: '0.85rem', fontWeight: 600, color: 'var(--text-main)' }}>Corporate ACH Direct Debit</div>
                                    <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>JPMorgan Chase •••• 8812 • Verified</div>
                                  </div>
                                </div>
                                <span style={{ fontSize: '0.725rem', color: 'var(--text-muted)' }}>Backup</span>
                              </div>
                            </div>

                            <div style={{ padding: '1.25rem', borderRadius: '10px', border: '1px solid var(--border)', backgroundColor: '#ffffff' }}>
                              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.85rem' }}>
                                <h4 style={{ fontSize: '0.9rem', fontWeight: 700, color: 'var(--text-main)' }}>Billing Profile & Tax Info</h4>
                                <span style={{ fontSize: '0.7rem', fontWeight: 700, padding: '0.15rem 0.5rem', borderRadius: '4px', backgroundColor: 'var(--success-bg)', color: 'var(--success)' }}>Verified Tax Exempt</span>
                              </div>
                              <div style={{ fontSize: '0.825rem', color: 'var(--text-main)', lineHeight: 1.6 }}>
                                <div style={{ fontWeight: 700 }}>Nexus Technologies Global, Inc.</div>
                                <div>100 Montgomery St, Suite 1400</div>
                                <div>San Francisco, CA 94104, United States</div>
                                <div style={{ marginTop: '0.45rem', fontSize: '0.775rem', color: 'var(--text-muted)' }}>Tax ID: <strong>US-94-3829104</strong> • PO: <strong>PO-2026-ENG-8492</strong></div>
                                <div style={{ fontSize: '0.775rem', color: 'var(--text-muted)' }}>Billing Inquiries: <strong>billing@nexus.ai</strong></div>
                              </div>
                            </div>
                          </div>

                          {/* Invoices Table */}
                          <div style={{ borderRadius: '10px', border: '1px solid var(--border)', backgroundColor: '#ffffff', overflow: 'hidden' }}>
                            <div style={{ padding: '1.15rem 1.25rem', borderBottom: '1px solid var(--border)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '0.5rem' }}>
                              <div>
                                <h4 style={{ fontSize: '0.95rem', fontWeight: 700, color: 'var(--text-main)' }}>Official Invoices & Tax Receipts</h4>
                                <p style={{ fontSize: '0.775rem', color: 'var(--text-muted)' }}>Download certified PDF audit invoices with cryptographic signatures</p>
                              </div>
                              <span style={{ fontSize: '0.75rem', color: 'var(--text-muted)', fontWeight: 600 }}>5 invoices available</span>
                            </div>
                            <div style={{ overflowX: 'auto' }}>
                              <table className="nexus-table" style={{ width: '100%' }}>
                                <thead>
                                  <tr>
                                    <th>Invoice ID</th>
                                    <th>Billing Cycle</th>
                                    <th>Issued Date</th>
                                    <th>Total Amount</th>
                                    <th>Status</th>
                                    <th style={{ textAlign: 'right' }}>Document</th>
                                  </tr>
                                </thead>
                                <tbody>
                                  {invoices.map((inv) => (
                                    <tr key={inv.id}>
                                      <td style={{ fontWeight: 700, fontFamily: 'monospace', color: 'var(--primary)' }}>{inv.id}</td>
                                      <td style={{ fontSize: '0.825rem' }}>{inv.period}</td>
                                      <td style={{ fontSize: '0.825rem', color: 'var(--text-muted)' }}>{inv.date}</td>
                                      <td style={{ fontWeight: 700, fontSize: '0.875rem' }}>{inv.amount}</td>
                                      <td>
                                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.35rem', padding: '0.2rem 0.55rem', borderRadius: '4px', fontSize: '0.725rem', fontWeight: 700, backgroundColor: 'var(--success-bg)', color: 'var(--success)' }}>
                                          <Check size={12} /> {inv.status}
                                        </span>
                                      </td>
                                      <td style={{ textAlign: 'right' }}>
                                        <button
                                          type="button"
                                          className="secondary-btn"
                                          style={{ fontSize: '0.75rem', padding: '0.35rem 0.75rem', display: 'inline-flex', alignItems: 'center', gap: '0.35rem' }}
                                          onClick={() => handleDownloadInvoice(inv)}
                                          disabled={downloadingInvId === inv.id}
                                        >
                                          <Download size={13} /> {downloadingInvId === inv.id ? 'Downloading...' : 'Download PDF'}
                                        </button>
                                      </td>
                                    </tr>
                                  ))}
                                </tbody>
                              </table>
                            </div>
                          </div>
                        </div>
                      )}

                      {/* SUBTAB 3: SECURITY & 2FA */}
                      {settingsSubTab === 'security' && (
                        <div>
                          <div style={{ marginBottom: '1.5rem' }}>
                            <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--text-main)' }}>Security & Authentication</h3>
                            <p style={{ fontSize: '0.825rem', color: 'var(--text-muted)' }}>Configure hardware keys, biometric 2FA, and monitor active sessions</p>
                          </div>

                          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '1.25rem', borderRadius: '10px', border: '1px solid var(--border)', marginBottom: '1.25rem', backgroundColor: '#ffffff' }}>
                            <div>
                              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.25rem' }}>
                                <span style={{ fontWeight: 700, fontSize: '0.9rem' }}>Two-Factor Authentication (2FA)</span>
                                <span style={{ padding: '0.15rem 0.45rem', borderRadius: '4px', fontSize: '0.7rem', fontWeight: 700, backgroundColor: twoFactorEnabled ? 'var(--success-bg)' : 'var(--danger-bg)', color: twoFactorEnabled ? 'var(--success)' : 'var(--danger)', border: `1px solid ${twoFactorEnabled ? 'var(--success-border)' : 'var(--danger-border)'}` }}>
                                  {twoFactorEnabled ? 'Enabled' : 'Disabled'}
                                </span>
                              </div>
                              <div style={{ fontSize: '0.785rem', color: 'var(--text-muted)' }}>Require authenticator app token on login.</div>
                            </div>
                            <label className="switch-toggle">
                              <input type="checkbox" checked={twoFactorEnabled} onChange={(e) => setTwoFactorEnabled(e.target.checked)} />
                              <span className="slider-round"></span>
                            </label>
                          </div>

                          <div style={{ border: '1px solid var(--border)', borderRadius: '10px', padding: '1.25rem', backgroundColor: '#ffffff' }}>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1rem', flexWrap: 'wrap', gap: '0.5rem' }}>
                              <div>
                                <div style={{ fontWeight: 700, fontSize: '0.9rem' }}>Active Browser Sessions</div>
                                <div style={{ fontSize: '0.785rem', color: 'var(--text-muted)' }}>Devices currently authenticated to your dashboard</div>
                              </div>
                              <button className="secondary-btn" style={{ fontSize: '0.785rem', padding: '0.4rem 0.85rem' }} onClick={() => { setToastMsg('Terminated all other active browser sessions.'); setTimeout(() => setToastMsg(null), 3500); }}>
                                Revoke Other Sessions
                              </button>
                            </div>
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.85rem 1rem', borderRadius: '8px', backgroundColor: '#f8fafc', border: '1px solid var(--border)' }}>
                              <div>
                                <div style={{ fontSize: '0.825rem', fontWeight: 700 }}>Chrome on Windows 11 (Current Session)</div>
                                <div style={{ fontSize: '0.725rem', color: 'var(--text-muted)' }}>IP: 192.168.1.1 • San Francisco, US</div>
                              </div>
                              <span style={{ padding: '0.2rem 0.5rem', borderRadius: '4px', fontSize: '0.7rem', fontWeight: 700, backgroundColor: 'var(--success-bg)', color: 'var(--success)', border: '1px solid var(--success-border)' }}>Active Now</span>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Details Modal */}
          {selectedRow && (
            <div className="modal-overlay" onClick={() => setSelectedRow(null)}>
              <div className="modal-dialog" onClick={(e) => e.stopPropagation()}>
                <div className="modal-header">
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <span className="modal-title">Transaction Details</span>
                    <span style={{ fontFamily: 'monospace', fontSize: '0.8rem', padding: '0.2rem 0.5rem', background: 'var(--primary-light)', color: 'var(--primary)', borderRadius: '4px', fontWeight: 700 }}>
                      {selectedRow.id}
                    </span>
                  </div>
                  <button className="modal-close-btn" onClick={() => setSelectedRow(null)}>&times;</button>
                </div>
                <div className="modal-body">
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem', padding: '0.85rem', borderRadius: '8px', backgroundColor: 'var(--bg-hover)', marginBottom: '1rem' }}>
                    <div className="customer-avatar-box" style={{ width: '38px', height: '38px' }}>
                      <User size={18} />
                    </div>
                    <div>
                      <div style={{ fontWeight: 700, fontSize: '0.95rem' }}>{selectedRow.customer.name}</div>
                      <div style={{ fontSize: '0.75rem', color: 'var(--text-muted)' }}>{selectedRow.customer.email}</div>
                    </div>
                  </div>
                  <div className="detail-row"><span className="detail-label">Plan Tier</span><span className="detail-value">{selectedRow.plan}</span></div>
                  <div className="detail-row"><span className="detail-label">Total Amount</span><span className="detail-value" style={{ color: 'var(--primary)', fontSize: '1.05rem' }}>${selectedRow.amount.toLocaleString(undefined, { minimumFractionDigits: 2 })}</span></div>
                  <div className="detail-row"><span className="detail-label">Status</span><span className="detail-value">{selectedRow.status}</span></div>
                  <div className="detail-row"><span className="detail-label">Origin</span><span className="detail-value">{selectedRow.country}</span></div>
                </div>
                <div className="modal-footer">
                  <button
                    className="secondary-btn"
                    onClick={() => handleDownloadInvoice({ id: selectedRow.id, date: selectedRow.date, period: 'Completed Order Transaction', amount: '$' + selectedRow.amount.toFixed(2), status: selectedRow.status, method: selectedRow.paymentMethod })}
                  >
                    <Download size={14} /> Download Invoice PDF
                  </button>
                  <button className="primary-btn" onClick={() => setSelectedRow(null)}>Close</button>
                </div>
              </div>
            </div>
          )}

          {/* Upgrade Plan Modal */}
          {showUpgradeModal && (
            <div className="modal-overlay" onClick={() => setShowUpgradeModal(false)}>
              <div className="modal-dialog" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '600px' }}>
                <div className="modal-header">
                  <div>
                    <h3 className="modal-title">Upgrade Enterprise Commitment Tier</h3>
                    <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>Scale quotas, edge bandwidth, and seats</p>
                  </div>
                  <button className="modal-close-btn" onClick={() => setShowUpgradeModal(false)}>&times;</button>
                </div>
                <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                  {[
                    { id: 'professional', name: 'Professional Platform', price: '$1,850/mo', desc: '4M API requests, 12 seats, 800GB CDN' },
                    { id: 'enterprise', name: 'Enterprise Cloud Suite (Current)', price: '$4,900/mo', desc: '10M API requests, 25 seats, 2TB CDN, Dedicated TAM' },
                    { id: 'sovereign', name: 'Sovereign Dedicated Cloud', price: '$9,500/mo', desc: 'Unlimited API requests, 100 seats, dedicated isolated VPC' }
                  ].map(t => (
                    <div
                      key={t.id}
                      onClick={() => setSelectedTier(t.id)}
                      style={{
                        padding: '1rem',
                        borderRadius: '8px',
                        border: selectedTier === t.id ? '2px solid var(--primary)' : '1px solid var(--border)',
                        backgroundColor: selectedTier === t.id ? 'var(--primary-light)' : '#ffffff',
                        cursor: 'pointer',
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center'
                      }}
                    >
                      <div>
                        <div style={{ fontWeight: 700, fontSize: '0.95rem' }}>{t.name}</div>
                        <div style={{ fontSize: '0.775rem', color: 'var(--text-muted)' }}>{t.desc}</div>
                      </div>
                      <div style={{ fontWeight: 800, fontSize: '1.05rem' }}>{t.price}</div>
                    </div>
                  ))}
                </div>
                <div className="modal-footer">
                  <button className="secondary-btn" onClick={() => setShowUpgradeModal(false)}>Cancel</button>
                  <button
                    className="primary-btn"
                    onClick={() => {
                      if (selectedTier === 'sovereign') { setCurrentPlan('Sovereign Dedicated Cloud'); setPlanPrice('$9,500.00'); }
                      else if (selectedTier === 'professional') { setCurrentPlan('Professional Platform'); setPlanPrice('$1,850.00'); }
                      else { setCurrentPlan('Enterprise Cloud Suite'); setPlanPrice('$4,900.00'); }
                      setShowUpgradeModal(false);
                      setToastMsg(`Successfully switched plan to ${selectedTier.toUpperCase()} tier!`);
                      setTimeout(() => setToastMsg(null), 4000);
                    }}
                  >
                    Confirm Plan Selection
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Update Payment Modal */}
          {showPaymentModal && (
            <div className="modal-overlay" onClick={() => setShowPaymentModal(false)}>
              <div className="modal-dialog" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '440px' }}>
                <div className="modal-header">
                  <div>
                    <h3 className="modal-title">Update Payment Method</h3>
                    <p style={{ fontSize: '0.8rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>Corporate Mastercard / Visa</p>
                  </div>
                  <button className="modal-close-btn" onClick={() => setShowPaymentModal(false)}>&times;</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  setShowPaymentModal(false);
                  setToastMsg('Primary corporate payment card updated successfully!');
                  setTimeout(() => setToastMsg(null), 4000);
                }}>
                  <div className="modal-body" style={{ display: 'flex', flexDirection: 'column', gap: '0.85rem' }}>
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label className="form-label">Name on Card</label>
                      <input type="text" className="form-input" defaultValue={paymentCard.holder} required />
                    </div>
                    <div className="form-group" style={{ marginBottom: 0 }}>
                      <label className="form-label">Card Number</label>
                      <input type="text" className="form-input" defaultValue={`•••• •••• •••• ${paymentCard.last4}`} required />
                    </div>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label className="form-label">Expiry</label>
                        <input type="text" className="form-input" defaultValue={paymentCard.expiry} required />
                      </div>
                      <div className="form-group" style={{ marginBottom: 0 }}>
                        <label className="form-label">CVC</label>
                        <input type="text" className="form-input" defaultValue="492" required />
                      </div>
                    </div>
                  </div>
                  <div className="modal-footer">
                    <button type="button" className="secondary-btn" onClick={() => setShowPaymentModal(false)}>Cancel</button>
                    <button type="submit" className="primary-btn">Save Payment Method</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div style={{ position: 'fixed', bottom: '2rem', right: '2rem', zIndex: 9999, backgroundColor: 'var(--dark-navy)', color: '#ffffff', padding: '0.85rem 1.35rem', borderRadius: '10px', boxShadow: '0 10px 25px -5px rgba(15,23,42,0.35)', display: 'flex', alignItems: 'center', gap: '0.75rem', fontSize: '0.875rem', fontWeight: 600, border: '1px solid rgba(255,255,255,0.15)' }}>
              <div style={{ color: '#4ade80' }}><Check size={18} /></div>
              <div>{toastMsg}</div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
